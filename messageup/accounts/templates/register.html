
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | msgup</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #052e16, #166534, #22c55e);
        }

        .page-container {
            width: 100%;
            max-width: 460px;
        }

        .register-card {
            background: #ffffff;
            padding: 36px;
            border-radius: 22px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.22);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #15803d;
            font-size: 43px;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 12px;
        }

        .logo .arrow {
            display: inline-block;
            margin-left: 5px;
            color: #22c55e;
            font-size: 39px;
            font-weight: 900;
            transform: translateY(-5px);
        }

        .brand h1 {
            color: #14532d;
            font-size: 28px;
            margin-bottom: 9px;
        }

        .brand p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        form {
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            background: #f9fafb;
            color: #111827;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s,
                        background 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            border-color: #16a34a;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.12);
        }

        button {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: linear-gradient(135deg, #15803d, #166534);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(22, 163, 74, 0.25);
        }

        /* Alert styles preserved */
        .alert {
            margin-top: 12px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .alert.success {
            background: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }

        .alert.error {
            background: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }

        .alert.info {
            background: #cff4fc;
            color: #055160;
            border: 1px solid #b6effb;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 28px 23px;
            }

            .brand h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="register-card">

            <div class="brand">
                <div class="logo">msg<span class="arrow">↗</span></div>
                <h1>Create Account</h1>
                <p>Join msgup and start connecting with others</p>
            </div>

            <form method="post">

                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>

                <button type="submit">Register</button>

                <div id="alertBox" class="alert" hidden></div>
            </form>

        </div>

        <div class="footer">
            © 2026 msgup. All rights reserved.
        </div>
    </div>

    <script src="{% static 'accounts/js/register.js' %}" defer></script>
</body>
</html>
